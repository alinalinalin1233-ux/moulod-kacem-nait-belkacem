<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ثانوية مولود قاسم نايت بلقاسم</title>
<style>
:root{color-scheme:dark;--bg:#07040f;--glass:rgba(255,255,255,.07);--bd:rgba(190,150,255,.22);--tx:#f3eeff;--mu:#a99cc9;--pu:#a855f7;--pu2:#6d28d9;--ok:#22c55e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(circle at 15% 10%,#4c1d95 0,transparent 45%),radial-gradient(circle at 90% 60%,#7e22ce55 0,transparent 50%),var(--bg);background-attachment:fixed;color:var(--tx);font-family:-apple-system,"SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif}
.tick{position:fixed;left:0;right:0;z-index:30;height:30px;overflow:hidden;direction:ltr;background:rgba(20,8,40,.75);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);font-size:13px;line-height:30px;color:#e9d8ff}
.tick span{display:inline-block;white-space:nowrap;padding-left:100%;animation:mq 18s linear infinite;direction:rtl}
@keyframes mq{to{transform:translateX(-100%)}}
#t1{top:env(safe-area-inset-top,0px)}#t2{bottom:env(safe-area-inset-bottom,0px)}
header{position:fixed;left:0;right:0;top:calc(30px + env(safe-area-inset-top,0px));z-index:20;height:54px;display:flex;align-items:center;justify-content:center;background:rgba(10,5,22,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bd)}
header h1{font-size:16px}
#burger{position:absolute;left:12px;top:9px;width:38px;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--glass);display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 9px;cursor:pointer}
#burger i{display:block;height:2.5px;border-radius:2px;background:#d8b4fe}
#lang{position:absolute;right:12px;top:11px;background:var(--glass);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:5px 6px;font-size:13px}
#menu{position:fixed;left:12px;top:calc(88px + env(safe-area-inset-top,0px));z-index:40;display:none;flex-direction:column;min-width:170px;padding:6px;border-radius:18px;background:rgba(25,10,50,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd)}
#menu.on{display:flex}
#menu button{background:none;border:0;color:var(--tx);text-align:start;padding:11px 14px;border-radius:12px;font-size:15px;cursor:pointer}
#menu button.sel{background:linear-gradient(135deg,var(--pu2),var(--pu))}
main{padding:calc(100px + env(safe-area-inset-top,0px)) 14px calc(130px + env(safe-area-inset-bottom,0px));max-width:720px;margin:auto}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 30px #0006}
.card h3{font-size:17px;margin:6px 0}
.card p{color:#e2d8f5;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.card img,.card video{display:block;width:100%;height:auto;max-height:none;border-radius:16px;margin-top:10px;object-fit:contain;background:#000}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;background:linear-gradient(135deg,var(--pu2),var(--pu))}
.tag.rec{background:linear-gradient(135deg,#0e7490,#22d3ee)}.tag.ann{background:linear-gradient(135deg,#be185d,#fb7185)}
.meta{color:var(--mu);font-size:12px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.b{border:0;border-radius:14px;padding:10px 16px;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--pu2),var(--pu));cursor:pointer}
button.b.g{background:var(--glass);border:1px solid var(--bd)}button.b.r{background:linear-gradient(135deg,#991b1b,#ef4444)}button.b.ok{background:linear-gradient(135deg,#15803d,var(--ok))}
input,textarea,select{width:100%;margin:6px 0;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:rgba(0,0,0,.35);color:var(--tx);font:inherit;font-size:15px}
label{font-size:13px;color:var(--mu)}
h2{font-size:20px;margin:4px 0 12px}
.done{background:linear-gradient(135deg,rgba(21,128,61,.55),rgba(34,197,94,.3));border-color:#22c55e}
.cm{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.3);font-size:14px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
nav{position:fixed;left:10px;right:10px;bottom:calc(38px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:space-around;padding:8px 4px;border-radius:28px;background:rgba(20,8,40,.6);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--bd);max-width:720px;margin:auto}
nav button{background:none;border:0;color:var(--mu);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1}
nav .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;box-shadow:inset 0 1px 1px #fff5,0 4px 10px #0007;transition:.2s}
nav button.on{color:#fff}nav button.on .ic{transform:scale(1.12)}
#modal{position:fixed;inset:0;z-index:60;background:#000a;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#sheet{width:100%;max-width:720px;max-height:90%;overflow:auto;background:rgba(25,10,50,.92);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--bd);border-radius:28px 28px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#2e1065;border:1px solid var(--pu);padding:10px 18px;border-radius:20px;z-index:80;display:none}
.fab{position:fixed;z-index:25;left:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:18px;border:0;font-size:28px;color:#fff;background:linear-gradient(135deg,var(--pu2),var(--pu));box-shadow:0 8px 24px #a855f766;cursor:pointer}
.mlist{display:flex;flex-direction:column;gap:6px;margin:8px 0}.mi{display:flex;align-items:center;gap:8px;background:rgba(127,127,127,.12);border-radius:10px;padding:6px 8px;font-size:14px}.mi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mi button{border:0;background:#c0392b;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="tick" id="t1"><span>ثانوية مولود قاسم نايت بلقاسم - سيدي نعمان - ولاية المدية ✦ ثانوية مولود قاسم نايت بلقاسم - سيدي نعمان - ولاية المدية</span></div>
<header><button id="burger" aria-label="menu"><i></i><i></i><i></i></button><h1 id="ttl">ثانوية مولود قاسم نايت بلقاسم</h1></header>
<div id="menu"></div>
<main><div id="sb"><input id="q" placeholder="🔍 بحث في العنوان أو الموضوع..." autocomplete="off"></div><div id="app"></div></main>
<nav id="nav"></nav><div class="tick" id="t2"><span>ثانوية مولود قاسم نايت بلقاسم - سيدي نعمان - ولاية المدية ✦ ثانوية مولود قاسم نايت بلقاسم - سيدي نعمان - ولاية المدية</span></div>
<div id="modal"><div id="sheet"></div></div><div id="toast"></div>
<script>
// ضع رابط Worker المنشور في CLOUDFLARE_WORKER_URL بعد نشر worker.js
const API_BASE = 'https://school-site-api.alinalinalin1233.workers.dev';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let token=localStorage.getItem('school_token')||'', role=localStorage.getItem('school_role')||null, tab='home', flt='all', posts=[], msgs=[], mine=ls('school_mine',[]), delId=null;
const T={home:'الرئيسية',couns:'المستشار',comp:'شكوى',act:'تفعيل',subs:'الإرسالات',all:'الكل',post:'منشور',rec:'توصية',ann:'إعلان',title:'العنوان (اختياري)',topic:'الموضوع (اختياري)',media:'صور وفيديوهات (اختياري)',type:'التصنيف (إجباري)',pick:'اختر التصنيف',publish:'نشر',save:'حفظ',cancel:'إلغاء',name:'الاسم',sname:'اللقب',cls:'القسم',phone:'رقم الهاتف (اختياري)',msg:'رسالتك: وضعية أو تساؤل',send:'إرسال',csend:'إرسال الشكوى للمدير',ctitle:'رسالة إلى المستشار',cmtitle:'رفع شكوى للمدير',code:'رمز التفعيل',enter:'دخول',logout:'تسجيل الخروج',role:'الصلاحية الحالية',edit:'تعديل',del:'حذف',sure:'تأكيد الحذف؟',empty:'لا يوجد شيء بعد',cmt:'تعليق',sent:'تم الإرسال',bad:'رمز غير صحيح',req:'الحقول المطلوبة ناقصة',nodb:'تحقق من رابط Worker وإعداداته',newp:'منشور جديد',none:'لا توجد رسائل',kc:'رسالة للمستشار',kp:'شكوى',student:'تلميذ',up:'جارٍ الرفع...',nomsg:'لا تملك صلاحية عرض الرسائل'};
const t=k=>T[k]||k; const fmt=ts=>ts?new Date(ts).toLocaleString('ar-DZ'):'';
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
async function api(path,opts={}){if(!API_BASE.startsWith('https://')||API_BASE.includes('PUT-YOUR'))throw Error('عدّل API_BASE في index.html وضع رابط Cloudflare Worker أولًا');const headers={...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;if(opts.body && !(opts.body instanceof FormData))headers['Content-Type']='application/json';const r=await fetch(API_BASE+path,{...opts,headers});const d=await r.json().catch(()=>({error:'استجابة غير مفهومة من الخادم'}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
let formMedia=[];const getMedia=p=>(p.media&&p.media.length)?p.media:(p.url?[{url:p.url,mt:p.mt,objectKey:p.objectKey}]:[]);
function mediaList(){return formMedia.map((m,i)=>`<div class="mi"><span>${m.mt==='video'?'🎬 فيديو':'🖼️ صورة'} ${i+1}</span><button type="button" data-rmm="${i}">حذف</button></div>`).join('')}
const canPost=()=>role==='admin'||role==='modire', canManage=()=>role==='admin'||role==='modire';
function renderNav(){$('nav').innerHTML=[['home','🏠'],['couns','💬'],['comp','📢'],['act','⭐'],['subs','📨']].map(([k,i])=>`<button data-tab="${k}" class="${tab===k?'on':''}"><span class="ic">${i}</span>${t(k)}</button>`).join('')}
function renderMenu(){$('menu').innerHTML=['all','post','rec','ann'].map(k=>`<button data-flt="${k}" class="${flt===k?'sel':''}">${t(k)}</button>`).join('')}
function feed(){const q=$('q').value.toLowerCase();const list=posts.filter(p=>(flt==='all'||p.type===flt)&&(`${p.title||''} ${p.body||''}`).toLowerCase().includes(q));let h=list.length?'':`<div class="empty">${t('empty')}</div>`;h+=list.map(p=>`<div class="card"><span class="tag ${esc(p.type)}">${t(p.type)}</span>${p.title?`<h3>${esc(p.title)}</h3>`:''}${p.body?`<p>${esc(p.body)}</p>`:''}${getMedia(p).map(m=>m.mt==='video'?`<video src="${esc(m.url)}" controls playsinline preload="metadata"></video>`:`<img src="${esc(m.url)}" alt="" loading="lazy">`).join('')}<div class="meta">${fmt(p.ts)}</div>${canManage()?`<div class="row"><button class="b g" data-edit="${esc(p.id)}">${t('edit')}</button><button class="b r" data-del="${esc(p.id)}">${delId===p.id?t('sure'):t('del')}</button></div>`:''}</div>`).join('');if(canPost())h+=`<button class="fab" data-new="1">＋</button>`;return h}
function postForm(p={}){formMedia=getMedia(p).map(m=>({...m}));return `<h2>${p.id?t('edit'):t('newp')}</h2><input id="pt" placeholder="${t('title')}" value="${esc(p.title||'')}"><textarea id="pb" rows="4" placeholder="${t('topic')}">${esc(p.body||'')}</textarea><label>${t('media')}</label><div class="mlist" id="ml">${mediaList()}</div><input id="pf" type="file" multiple accept="image/*,video/mp4,video/webm,video/quicktime"><small>يمكنك اختيار عدة صور وفيديوهات معًا. الحد الأقصى 20 ميغابايت لكل ملف.</small><label>${t('type')}</label><select id="pty"><option value="">${t('pick')}</option>${['post','rec','ann'].map(k=>`<option value="${k}" ${p.type===k?'selected':''}>${t(k)}</option>`).join('')}</select><div class="row"><button class="b" data-savep="${esc(p.id||'')}">${p.id?t('save'):t('publish')}</button><button class="b g" data-close="1">${t('cancel')}</button></div>`}
function msgForm(kind){return `<div class="card"><h2>${kind==='counselor'?'💬 '+t('ctitle'):'📢 '+t('cmtitle')}</h2><input id="mn" placeholder="${t('name')}"><input id="ms" placeholder="${t('sname')}"><input id="mc" placeholder="${t('cls')}"><input id="mp" type="tel" placeholder="${t('phone')}"><textarea id="mt" rows="5" placeholder="${t('msg')}"></textarea><button class="b" data-sendm="${kind}">${kind==='counselor'?t('send'):t('csend')}</button></div>`}
function star(){return `<div class="card"><h2>⭐ ${t('act')}</h2>${role?`<p>${t('role')}: <b>${esc(role)}</b></p><div class="row"><button class="b r" data-logout="1">${t('logout')}</button></div>${role==='modire'?`<h3 style="margin-top:18px">🔑 تغيير رموز التفعيل</h3><p>اكتب الرمز الجديد لأي صلاحية تريد تغييرها. اترك الحقل فارغًا للإبقاء على الرمز الحالي.</p><label>رمز الأدمين الجديد</label><input id="cA" type="password" autocomplete="new-password"><label>رمز المستشار الجديد</label><input id="cM" type="password" autocomplete="new-password"><label>رمز المدير الجديد</label><input id="cD" type="password" autocomplete="new-password"><div class="row"><button class="b" data-savecodes="1">حفظ الرموز</button></div>`:''}`:`<input id="cd" type="password" placeholder="${t('code')}" autocomplete="current-password"><button class="b" data-login="1">${t('enter')}</button>`}</div>`}
function subs(){if(role==='admin'||!role)return `<div class="empty">${t('nomsg')}</div>`;const list=msgs.filter(m=>role==='modire'||(role==='mostachar'&&m.kind==='counselor')||(role==='admin'&&false));if(!list.length)return `<div class="empty">${t('none')}</div>`;return list.map(m=>`<div class="card ${m.done?'done':''}"><span class="tag">${m.kind==='counselor'?t('kc'):t('kp')}</span><h3>${esc(m.name)} ${esc(m.sname)} — ${esc(m.cls)}</h3>${m.phone?`<div class="meta">☎ ${esc(m.phone)}</div>`:''}<p>${esc(m.text)}</p><div class="meta">${fmt(m.ts)}</div><div class="row"><button class="b ok" data-ok="${esc(m.id)}" data-v="${m.done?'0':'1'}">${m.done?'إلغاء المعالجة':'تمت المعالجة'}</button><button class="b r" data-delm="${esc(m.id)}">${delId===m.id?t('sure'):t('del')}</button></div></div>`).join('')}
function render(){const a=$('app');$('sb').style.display=(tab==='home'||tab==='subs')?'block':'none';if(tab==='home')a.innerHTML=feed();else if(tab==='couns')a.innerHTML=msgForm('counselor');else if(tab==='comp')a.innerHTML=msgForm('complaint');else if(tab==='act')a.innerHTML=star();else a.innerHTML=subs();renderNav();renderMenu()}
function go(k){tab=k;render();if(k==='subs')loadMsgs();scrollTo(0,0)}function openM(h){$('sheet').innerHTML=h;$('modal').classList.add('on')}function closeM(){$('modal').classList.remove('on')}
async function loadPosts(){try{posts=(await api('/api/posts')).posts||[]}catch(e){toast(e.message)}if(tab==='home')render()}
async function loadMsgs(){if(!role||role==='admin')return;try{msgs=(await api('/api/messages')).messages||[]}catch(e){toast(e.message)}if(tab==='subs')render()}
async function savePost(id){const type=$('pty').value;if(!type){toast(t('req'));return}const files=[...$('pf').files];if(files.some(f=>f.size>20*1024*1024)){toast('أحد الملفات أكبر من 20 ميغابايت');return}if(!id&&!$('pt').value.trim()&&!$('pb').value.trim()&&!files.length&&!formMedia.length){toast(t('req'));return}try{const media=[...formMedia];for(let i=0;i<files.length;i++){toast(t('up')+' '+(i+1)+'/'+files.length);const fd=new FormData();fd.append('file',files[i]);const u=await api('/api/upload',{method:'POST',body:fd});media.push({url:u.url,mt:u.mt,objectKey:u.objectKey})}toast('جارٍ الحفظ...');const d={title:$('pt').value.trim(),body:$('pb').value.trim(),type,media};const f0=media[0];d.url=f0?f0.url:'';d.mt=f0?f0.mt:'';d.objectKey=f0?f0.objectKey:'';if(id)await api('/api/posts/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(d)});else await api('/api/posts',{method:'POST',body:JSON.stringify(d)});closeM();await loadPosts();toast('تم الحفظ')}catch(e){toast(e.message)}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;if(b.id==='burger'){$('menu').classList.toggle('on');return}if(D.tab){go(D.tab);return}if(D.flt){flt=D.flt;tab='home';render();$('menu').classList.remove('on');return}if(D.new){openM(postForm());return}if(D.edit){openM(postForm(posts.find(p=>p.id===D.edit)||{}));return}if(D.rmm!==undefined){formMedia.splice(+D.rmm,1);$('ml').innerHTML=mediaList();return}if(D.close){closeM();return}if(D.savep!==undefined){savePost(D.savep);return}if(D.del){if(delId===D.del){try{await api('/api/posts/'+encodeURIComponent(D.del),{method:'DELETE'});delId=null;await loadPosts()}catch(x){toast(x.message)}}else delId=D.del;render();return}if(D.login){try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({code:$('cd').value.trim()})});token=d.token;role=d.role;localStorage.setItem('school_token',token);localStorage.setItem('school_role',role);toast('تم تسجيل الدخول');render();if(tab==='subs')loadMsgs()}catch(x){toast(x.message)}return}if(D.logout){token='';role=null;localStorage.removeItem('school_token');localStorage.removeItem('school_role');msgs=[];render();return}if(D.savecodes){const codes={admin:$('cA').value,mostachar:$('cM').value,modire:$('cD').value};try{await api('/api/codes',{method:'PUT',body:JSON.stringify(codes)});['cA','cM','cD'].forEach(i=>$(i).value='');toast('تم حفظ رموز التفعيل بأمان')}catch(x){toast(x.message)}return}if(D.sendm){const g=i=>$(i).value.trim();const d={kind:D.sendm,name:g('mn'),sname:g('ms'),cls:g('mc'),phone:g('mp'),text:g('mt')};if(!d.name||!d.sname||!d.cls||!d.text){toast(t('req'));return}try{await api('/api/messages',{method:'POST',body:JSON.stringify(d)});const saved=ls('school_mine',[]);saved.push({name:d.name,sname:d.sname,cls:d.cls,kind:d.kind,text:d.text});localStorage.setItem('school_mine',JSON.stringify(saved));toast(t('sent'));go('home')}catch(x){toast(x.message)}return}if(D.ok){try{await api('/api/messages/'+encodeURIComponent(D.ok),{method:'PATCH',body:JSON.stringify({done:D.v==='1'})});await loadMsgs()}catch(x){toast(x.message)}return}if(D.delm){if(delId===D.delm){try{await api('/api/messages/'+encodeURIComponent(D.delm),{method:'DELETE'});delId=null;await loadMsgs()}catch(x){toast(x.message)}}else delId=D.delm;render();return}});
$('q').oninput=()=>render();$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
(async()=>{render();await loadPosts();if(token){try{const d=await api('/api/me');role=d.role;localStorage.setItem('school_role',role);render();if(tab==='subs')loadMsgs()}catch{token='';role=null;localStorage.removeItem('school_token');localStorage.removeItem('school_role');render()}}})();
</script>
</body></html>
